<style>

.s{padding:0;gap:12px;align-items:stretch}.s::before{content:"";order:1;width:12px;flex:none;opacity:.5;background:radial-gradient(circle,var(--lc) 4.5px,transparent 5.5px) center/12px 12px no-repeat,linear-gradient(var(--lc),var(--lc)) center/2px 100% no-repeat}

#body{scrollbar-width:thin;scrollbar-color:var(--fill) transparent}
#cfg:active{transform:scale(.98)}
.row{margin-right:16px}.row input{width:100%;min-width:0}
#flip{flex:none;max-width:55%;height:52px;border:0;border-radius:24px;padding:0 16px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:inset 0 0 0 2px var(--lc)}

.hint{display:none}
#note{margin:6px 16px 0;font-size:12px;font-weight:600;color:var(--mute);text-align:center}

.cnt{font-size:12px;color:var(--mute);font-weight:600}

.stp{width:100%;max-width:520px;margin:0 auto}

<div id="start" data-step="0">

  <div class="stp s3"><button class="back" data-back="2">‹ Direction</button><h1>Select station</h1><div style="display:flex;gap:8px;margin:0 16px 10px"><input id="sq" placeholder="Search station or code" autocomplete="off" style="flex:1;min-width:0;height:44px;border:0;border-radius:22px;padding:0 16px;background:var(--card);color:var(--ink);font:inherit"><button class="more" id="loc" style="margin:0;flex:none;width:auto;padding:0 14px;white-space:nowrap">📍 Nearest</button></div><button class="more" id="srt" style="margin:0 16px 10px;width:auto"></button><div class="stl" id="stl"></div><button class="more go" id="go">Start</button></div>

<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
const $ = id => document.getElementById(id), P = n => /^\d+$/.test(n) ? n.padStart(3, "0") : n;
let byCode = false, phX = false;
let S, N, st = {}, pin = null, cur = -1, tm;
try { st = JSON.parse(localStorage.getItem("trn3") || "{}"); } catch (e) {}
if (!st || typeof st !== "object") st = {};
const hm = s => { s = ((s / 60 % 1440) + 1440) % 1440 | 0; return String(s / 60 | 0).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const sgt = () => Object.fromEntries(new Intl.DateTimeFormat("en-CA", {timeZone: "Asia/Singapore", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit"}).formatToParts(new Date()).map(x => [x.type, x.value]));
let stale = false;
// shortcut: once the date is past every service's end the weekday/PH patterns keep repeating (specials excluded); upgrade = regenerate schedule.json
function active(ds, dow) {
  const a = new Set(), late = ds > Math.max(...Object.values(S.services).map(v => v.end)); if (late) stale = true;
  for (const id in S.services) { const v = S.services[id]; if (v.days[dow] && v.start <= ds && (ds <= v.end || late && !/SPECIAL/.test(id))) a.add(id); }
  for (const [id, d, t] of S.exceptions) if (d === ds) t === 1 ? a.add(id) : a.delete(id);
  return a;
}
function days() {
  stale = false;
  const p = sgt(), day = Date.UTC(p.year, p.month - 1, p.day), secs = p.hour * 3600 + p.minute * 60 + +p.second;
  return [0, 1].map(k => { const d = new Date(day - k * 864e5);
    return {k, now: secs + 86400 * k, act: active(d.toISOString().slice(0, 10).replaceAll("-", ""), (d.getUTCDay() + 6) % 7)}; });
}
const cap = c => `<img class="cap" src="caplets/${(c.match(/^[A-Z]+/)||[""])[0]}/${c}.svg" alt="${c}" onerror="this.outerHTML='<i>'+this.alt+'</i>'">`;
const nm = c => N.names[c] || c;
const LN = {NSL: "North-South", EWL: "East-West", NEL: "North East", CCL: "Circle", DTL: "Downtown", TEL: "Thomson-East Coast"};
let step = 0;
const LINES = ["NSL", "EWL", "NEL", "CCL", "DTL", "TEL"];
function ends(line) { const c = {}; for (const t of S.trips) if (t.line === line && t.dir != null) { const k = t.dir + "|" + t.stops.at(-1)[0]; c[k] = (c[k] || 0) + 1; }
  const o = {}; for (const k in c) { const [d, z] = k.split("|"); if (!o[d] || c[k] > o[d][1]) o[d] = [z, c[k]]; } return o; }
// CCL is a loop: ascending CC numbers run anticlockwise
